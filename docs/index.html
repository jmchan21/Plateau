<style>
/* Layout: one phone-first app column, sticky header, fixed bottom tab bar. The ventilator monitor is a fixed dark "device" in both themes. */
:root{
  --bg:#0d1719; --surface:#132226; --raised:#1a2d32; --line:#253c42; --fg:#e5efed; --muted:#8fa8a6; --faint:#5f7876;
  --accent:#ffbd45; --on-accent:#1f1500; --accent-soft:rgba(255,189,69,.14);
  --good:#45d08b; --warn:#ffb020; --crit:#ff5f6b; --good-soft:rgba(69,208,139,.14); --warn-soft:rgba(255,176,32,.14); --crit-soft:rgba(255,95,107,.14);
  --mon-bg:#071113; --mon-line:#18292d; --mon-fg:#e8f3f1; --mon-muted:#7d9895; --mon-p:#ffc94d; --mon-f:#4fe0a3; --mon-v:#66c9ff;
  --font-display:"Bricolage Grotesque","Avenir Next",system-ui,sans-serif;
  --font-body:"Figtree",-apple-system,BlinkMacSystemFont,"Segoe UI",system-ui,sans-serif;
  --font-data:"JetBrains Mono",ui-monospace,"SF Mono",Menlo,monospace;
  --r-lg:18px; --r-md:12px; --r-sm:8px;
  color-scheme:dark;
}
@media (prefers-color-scheme: light){ :root:not([data-theme="dark"]){
  --bg:#edf2f1; --surface:#ffffff; --raised:#f4f8f7; --line:#d3dfdd; --fg:#0f2022; --muted:#4f6765; --faint:#8a9e9c;
  --accent:#b86f00; --on-accent:#ffffff; --accent-soft:rgba(184,111,0,.10);
  --good:#108a52; --warn:#a86500; --crit:#cc2f40; --good-soft:rgba(16,138,82,.10); --warn-soft:rgba(168,101,0,.10); --crit-soft:rgba(204,47,64,.09);
  color-scheme:light; } }
:root[data-theme="light"]{
  --bg:#edf2f1; --surface:#ffffff; --raised:#f4f8f7; --line:#d3dfdd; --fg:#0f2022; --muted:#4f6765; --faint:#8a9e9c;
  --accent:#b86f00; --on-accent:#ffffff; --accent-soft:rgba(184,111,0,.10);
  --good:#108a52; --warn:#a86500; --crit:#cc2f40; --good-soft:rgba(16,138,82,.10); --warn-soft:rgba(168,101,0,.10); --crit-soft:rgba(204,47,64,.09);
  color-scheme:light; }

html,body{background:var(--bg);color:var(--fg)}
body{font-family:var(--font-body);font-size:16px;line-height:1.5;-webkit-font-smoothing:antialiased;
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:10;background:var(--bg)}
*{box-sizing:border-box}
button{font:inherit;color:inherit;cursor:pointer}
a{color:var(--accent)}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px;border-radius:6px}
.app{max-width:760px;margin:0 auto;padding-bottom:calc(92px + env(safe-area-inset-bottom,0px))}

/* header */
.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:var(--bg);display:flex;align-items:center;gap:12px;padding-block:12px 10px;border-bottom:1px solid var(--line)}
.brand{display:flex;align-items:center;gap:8px;font-family:var(--font-display);font-weight:800;font-size:21px;letter-spacing:-.01em;background:none;border:0;padding:0}
.brand svg{flex:none}
.top .spacer{flex:1}
.lvl{font-family:var(--font-data);font-size:11.5px;color:var(--muted);text-align:right;line-height:1.25}
.lvl b{color:var(--fg);font-weight:600}
.iconbtn{width:38px;height:38px;border-radius:50%;border:1px solid var(--line);background:var(--surface);display:grid;place-items:center;flex:none}

/* tab bar */
.tabbar{position:fixed;left:0;right:0;bottom:0;z-index:6;background:color-mix(in srgb,var(--bg) 88%,transparent);backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);border-top:1px solid var(--line);
  padding:6px max(10px,env(safe-area-inset-right,0px)) calc(6px + env(safe-area-inset-bottom,0px)) max(10px,env(safe-area-inset-left,0px))}
.tabbar .in{max-width:760px;margin:0 auto;display:grid;grid-template-columns:repeat(5,1fr)}
.tab{background:none;border:0;display:flex;flex-direction:column;align-items:center;gap:2px;padding:6px 0;color:var(--faint);font-size:11px;font-weight:600;position:relative}
.tab[aria-current="page"]{color:var(--accent)}
.tab .badge{position:absolute;top:2px;left:calc(50% + 6px);min-width:17px;height:17px;padding:0 5px;border-radius:9px;background:var(--crit);color:#fff;font-size:10.5px;line-height:17px;font-family:var(--font-data)}

/* type */
.eyebrow{font-family:var(--font-data);font-size:11px;letter-spacing:.09em;text-transform:uppercase;color:var(--muted)}
h1,h2,h3{font-family:var(--font-display);text-wrap:balance;margin:0;letter-spacing:-.015em}
h1{font-size:30px;line-height:1.1;font-weight:800}
h2{font-size:21px;line-height:1.2;font-weight:700}
h3{font-size:17px;line-height:1.3;font-weight:700}
p{margin:0}
.muted{color:var(--muted)}
.mono{font-family:var(--font-data);font-variant-numeric:tabular-nums}
.stack{display:flex;flex-direction:column;gap:14px}
.stack-lg{display:flex;flex-direction:column;gap:26px}
.row{display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.screen{padding-block:20px 8px}

/* surfaces */
.panel{background:var(--surface);border:1px solid var(--line);border-radius:var(--r-lg);padding:16px}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;border-radius:var(--r-md);padding:12px 16px;font-weight:700;border:1px solid transparent;min-height:46px;text-decoration:none}
.btn.primary{background:var(--accent);color:var(--on-accent)}
.btn.ghost{background:transparent;border-color:var(--line);color:var(--fg)}
.btn.block{width:100%}
.btn:disabled{opacity:.45;cursor:default}
.chips{display:flex;gap:8px;overflow-x:auto;padding-bottom:2px;scrollbar-width:none}
.chips::-webkit-scrollbar{display:none}
.chip{flex:none;border:1px solid var(--line);background:var(--surface);border-radius:999px;padding:7px 13px;font-size:13.5px;font-weight:600;color:var(--muted)}
.chip[aria-pressed="true"]{background:var(--fg);color:var(--bg);border-color:var(--fg)}
.pill{display:inline-flex;align-items:center;gap:6px;font-family:var(--font-data);font-size:11px;letter-spacing:.06em;text-transform:uppercase;padding:3px 8px;border-radius:6px;background:var(--raised);color:var(--muted)}
.pill.good{background:var(--good-soft);color:var(--good)} .pill.warn{background:var(--warn-soft);color:var(--warn)} .pill.crit{background:var(--crit-soft);color:var(--crit)} .pill.acc{background:var(--accent-soft);color:var(--accent)}

/* home */
.hero{display:flex;flex-direction:column;gap:6px}
.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}
.stat{background:var(--surface);border:1px solid var(--line);border-radius:var(--r-md);padding:12px}
.stat .v{font-family:var(--font-display);font-size:26px;font-weight:800;line-height:1.1}
.stat .k{font-size:12.5px;color:var(--muted)}
.plan{display:flex;flex-direction:column}
.plan a{display:flex;gap:14px;align-items:center;padding:14px 0;border-top:1px solid var(--line);color:var(--fg);text-decoration:none}
.plan a:first-of-type{border-top:0}
.plan .ic{width:42px;height:42px;border-radius:12px;background:var(--raised);display:grid;place-items:center;flex:none;color:var(--accent)}
.plan .tx{flex:1;min-width:0}
.plan .tx b{display:block;font-weight:700}
.plan .tx span{font-size:14px;color:var(--muted)}
.mastery{display:flex;flex-direction:column;gap:12px}
.mrow{display:grid;grid-template-columns:150px 1fr 44px;gap:12px;align-items:center;font-size:14.5px}
.bar{height:8px;border-radius:5px;background:var(--raised);overflow:hidden}
.bar i{display:block;height:100%;border-radius:5px;background:var(--accent)}
@media (max-width:420px){.mrow{grid-template-columns:118px 1fr 38px;font-size:13.5px}}
.trust{font-size:13px;color:var(--muted);display:flex;gap:10px;align-items:flex-start}

/* monitor */
.monitor{background:var(--mon-bg);color:var(--mon-fg);border-radius:var(--r-lg);border:1px solid var(--mon-line);overflow:hidden}
.mon-head{display:flex;justify-content:space-between;align-items:center;padding:10px 14px;border-bottom:1px solid var(--mon-line);font-family:var(--font-data);font-size:12px;color:var(--mon-muted);gap:10px}
.mon-head b{color:var(--mon-fg);font-weight:600}
.mon-body{display:grid;grid-template-columns:1fr 168px}
.wave{position:relative;min-width:0}
.wave canvas{display:block;width:100%;height:270px}
.nums{border-left:1px solid var(--mon-line);display:grid;grid-template-columns:1fr 1fr;align-content:start}
.num{padding:8px 10px;border-bottom:1px solid var(--mon-line);min-width:0}
.num:nth-child(odd){border-right:1px solid var(--mon-line)}
.num .k{font-family:var(--font-data);font-size:10px;letter-spacing:.06em;text-transform:uppercase;color:var(--mon-muted);white-space:nowrap}
.num .v{font-family:var(--font-data);font-size:20px;font-weight:600;line-height:1.2;font-variant-numeric:tabular-nums}
.num .u{font-size:10px;color:var(--mon-muted);margin-left:2px}
.num.p .v{color:var(--mon-p)} .num.f .v{color:var(--mon-f)} .num.v2 .v{color:var(--mon-v)}
.num.alarm{background:rgba(255,95,107,.16)} .num.alarm .v{color:#ff8a93}
.num.pending .v{color:var(--mon-muted)}
@media (max-width:560px){.mon-body{grid-template-columns:1fr}.nums{border-left:0;border-top:1px solid var(--mon-line);grid-template-columns:repeat(5,1fr)}.num:nth-child(odd){border-right:0}.num{border-right:1px solid var(--mon-line);padding:7px 7px}.num:nth-child(5n){border-right:0}.num .k{font-size:9px;letter-spacing:.03em}.num .v{font-size:16px}.num .u{display:block;margin-left:0;line-height:1.1}.wave canvas{height:230px}}
.mon-head #modeTag{white-space:nowrap}
.alarmbar{display:flex;gap:8px;align-items:center;padding:8px 14px;background:rgba(255,95,107,.16);color:#ffb3b9;font-family:var(--font-data);font-size:12px;border-top:1px solid var(--mon-line)}

/* sim controls */
.modes{display:inline-grid;grid-template-columns:1fr 1fr;background:var(--raised);border-radius:10px;padding:3px;border:1px solid var(--line)}
.modes button{border:0;background:none;padding:7px 16px;border-radius:8px;font-weight:700;font-size:14px;color:var(--muted)}
.modes button[aria-pressed="true"]{background:var(--surface);color:var(--fg);box-shadow:0 1px 3px rgba(0,0,0,.2)}
.ctrls{display:grid;grid-template-columns:1fr 1fr;gap:10px}
@media (max-width:460px){.ctrls{grid-template-columns:1fr}}
.ctrl{background:var(--raised);border:1px solid var(--line);border-radius:var(--r-md);padding:10px 12px}
.ctrl .lab{display:flex;justify-content:space-between;align-items:baseline;gap:8px}
.ctrl .lab span{font-size:13px;color:var(--muted);font-weight:600}
.ctrl .lab output{font-family:var(--font-data);font-size:18px;font-weight:600}
.ctrl .lab small{font-family:var(--font-data);font-size:11px;color:var(--muted)}
.ctrl .adj{display:grid;grid-template-columns:34px 1fr 34px;gap:8px;align-items:center;margin-top:6px}
.ctrl .adj button{height:34px;border-radius:9px;border:1px solid var(--line);background:var(--surface);font-weight:700;font-size:18px;line-height:1}
input[type=range]{width:100%;accent-color:var(--accent);height:28px}
.actions{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.actions .btn{padding:10px 8px;font-size:14px;min-height:44px}
.goals{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:8px}
.goals li{display:flex;gap:10px;align-items:flex-start;font-size:14.5px}
.gdot{flex:none;width:20px;height:20px;border-radius:50%;display:grid;place-items:center;font-size:12px;font-weight:800;margin-top:1px;border:1.5px solid var(--faint);color:var(--faint)}
.gdot.ok{background:var(--good);border-color:var(--good);color:var(--bg)}
.gdot.no{border-color:var(--crit);color:var(--crit)}
.abg{display:grid;grid-template-columns:repeat(5,1fr);gap:6px;text-align:center}
.abg div{background:var(--raised);border-radius:10px;padding:8px 4px}
.abg .k{font-size:11px;color:var(--muted);font-family:var(--font-data)}
.abg .v{font-family:var(--font-data);font-weight:600;font-size:17px}
.coach{font-size:14px;color:var(--muted);display:flex;flex-direction:column;gap:6px}
.coach b{color:var(--fg)}
details summary{cursor:pointer;font-weight:700;list-style:none;display:flex;justify-content:space-between;align-items:center}
details summary::-webkit-details-marker{display:none}
details summary::after{content:"+";font-family:var(--font-data);color:var(--muted);font-size:18px}
details[open] summary::after{content:"\2212"}

/* cases */
.clist{display:grid;grid-template-columns:1fr 1fr;gap:12px}
@media (max-width:560px){.clist{grid-template-columns:1fr}}
.ccard{display:flex;flex-direction:column;gap:10px;text-align:left;background:var(--surface);border:1px solid var(--line);border-radius:var(--r-lg);padding:16px;color:var(--fg);text-decoration:none}
.ccard .meta{display:flex;justify-content:space-between;align-items:center;gap:8px}
.ccard p{font-size:14.5px;color:var(--muted)}
.vitals{display:grid;grid-template-columns:repeat(4,1fr);background:var(--mon-bg);color:var(--mon-fg);border-radius:var(--r-md);border:1px solid var(--mon-line);overflow:hidden}
.vitals div{padding:8px 10px;border-right:1px solid var(--mon-line)}
.vitals div:last-child{border-right:0}
.vitals .k{font-family:var(--font-data);font-size:10px;letter-spacing:.06em;text-transform:uppercase;color:var(--mon-muted)}
.vitals .v{font-family:var(--font-data);font-size:17px;font-weight:600;font-variant-numeric:tabular-nums}
.vitals .hr .v{color:var(--mon-f)} .vitals .sp .v{color:var(--mon-v)} .vitals .pp .v{color:var(--mon-p)} .vitals .bp .v{color:#ff9aa3}
.ventline{font-family:var(--font-data);font-size:12px;color:var(--mon-muted);padding:7px 10px;border-top:1px solid var(--mon-line);grid-column:1/-1;background:var(--mon-bg)}
.narr{font-size:16.5px;line-height:1.6;max-width:62ch}
.choices{display:flex;flex-direction:column;gap:10px}
.choice{text-align:left;border:1.5px solid var(--line);background:var(--surface);border-radius:var(--r-md);padding:13px 14px;font-size:15.5px;line-height:1.45;display:flex;gap:12px;align-items:flex-start}
.choice .key{flex:none;width:24px;height:24px;border-radius:7px;background:var(--raised);display:grid;place-items:center;font-family:var(--font-data);font-size:12px;font-weight:600;color:var(--muted)}
.choice:disabled{cursor:default}
.choice.sel-best,.choice.is-correct{border-color:var(--good);background:var(--good-soft)}
.choice.sel-ok{border-color:var(--warn);background:var(--warn-soft)}
.choice.sel-bad,.choice.is-wrong{border-color:var(--crit);background:var(--crit-soft)}
.choice.dim{opacity:.55}
.fb{border-radius:var(--r-md);padding:14px;background:var(--raised);border:1px solid var(--line);display:flex;flex-direction:column;gap:8px;font-size:15px}
.refs{list-style:none;padding:0;margin:0;display:flex;flex-direction:column;gap:8px;font-size:13.5px}
.refs li{display:flex;gap:10px;align-items:baseline}
.refs .pm{flex:none;font-family:var(--font-data);font-size:11.5px;padding:2px 7px;border-radius:6px;background:var(--accent-soft);color:var(--accent);text-decoration:none;white-space:nowrap}
.refs .pm.none{background:var(--raised);color:var(--muted)}
.progress{height:4px;background:var(--raised);border-radius:3px;overflow:hidden}
.progress i{display:block;height:100%;background:var(--accent);transition:width .3s}
.points{margin:0;padding-left:20px;display:flex;flex-direction:column;gap:6px;font-size:15px}
.score{font-family:var(--font-display);font-size:48px;font-weight:800;line-height:1}

/* review cards */
.flash{min-height:300px;display:flex;flex-direction:column;gap:14px;justify-content:space-between}
.flash .front{font-family:var(--font-display);font-size:22px;line-height:1.3;font-weight:700;text-wrap:balance}
.flash .back{font-size:16.5px;line-height:1.6;border-top:1px dashed var(--line);padding-top:14px}
.grades{display:grid;grid-template-columns:repeat(4,1fr);gap:8px}
.grade{border-radius:var(--r-md);border:1px solid var(--line);background:var(--surface);padding:10px 4px;display:flex;flex-direction:column;align-items:center;gap:2px;font-weight:700;font-size:14px}
.grade small{font-family:var(--font-data);font-size:11px;color:var(--muted);font-weight:400}
.grade.again{color:var(--crit)} .grade.easy{color:var(--good)}
.linked{display:flex;gap:8px;align-items:center;font-size:13.5px;color:var(--muted)}
.linked a{font-weight:600}

/* sheet */
.sheet-back{position:fixed;inset:0;background:rgba(0,0,0,.55);z-index:20;display:flex;align-items:flex-end;justify-content:center}
.sheet{background:var(--surface);border:1px solid var(--line);border-radius:22px 22px 0 0;max-width:640px;width:100%;max-height:86vh;overflow:auto;
  padding:22px max(18px,env(safe-area-inset-right,0px)) calc(22px + env(safe-area-inset-bottom,0px)) max(18px,env(safe-area-inset-left,0px))}
.toast{position:fixed;left:50%;bottom:calc(96px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:var(--fg);color:var(--bg);padding:10px 16px;border-radius:12px;font-weight:600;font-size:14px;z-index:30;max-width:calc(100% - 32px);text-align:center}
.src{display:flex;flex-direction:column;gap:2px;padding:12px 0;border-top:1px solid var(--line)}
.src:first-child{border-top:0}
.src .t{font-weight:600}
.src .c{font-size:13.5px;color:var(--muted)}
@media (prefers-reduced-motion: reduce){*{transition:none!important;animation:none!important}}
</style>
</head>

<div class="app">
  <header class="top">
    <a class="brand" href="#home" aria-label="Plateau home" style="color:var(--fg);text-decoration:none">
      <svg width="26" height="26" viewBox="0 0 26 26" aria-hidden="true"><rect x="0.5" y="0.5" width="25" height="25" rx="7" fill="var(--accent)"/><path d="M4 18h3.5l2-9h7l1.2 5H22" fill="none" stroke="var(--on-accent)" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"/></svg>

    </a>

    <div class="lvl" id="lvl"></div>

  </header>
  <main id="view"></main>
</div>
<nav class="tabbar" aria-label="Sections"><div class="in" id="tabs"></div></nav>

<script>
"use strict";
/* ================= CONTENT ================= */
const CONTENT_VERSION = "1.0";
const REVIEWED = "2026-11-08";
const NEXT_SCAN = "Dec 1, 2026";

const TOPICS = {basics:"Modes & settings", ards:"ARDS", obstructive:"Obstructive disease", trouble:"Troubleshooting", liberation:"Liberation", niv:"NIV & sedation"};

const SOURCES = {

const CARDS = [
  {id:"c-ppeak-pplat",topic:"trouble",f:"High peak pressure, normal plateau. What kind of problem is it?",b:"Resistance (airway or tube): kink, biting, secretions, mucus plug, bronchospasm. Peak minus plateau reflects resistance × flow.",link:{t:"case",id:"alarm"},src:["phys"]},
  {id:"c-pplat-high",topic:"trouble",f:"Peak AND plateau both rose by the same amount. Differential?",b:"Compliance problem: pneumothorax, mainstem intubation, atelectasis or lobar collapse, pulmonary edema, worsening ARDS, abdominal distension, auto-PEEP.",link:{t:"case",id:"ptx"},src:["phys"]},
  {id:"c-dope",topic:"trouble",f:"Ventilated patient is crashing. First move, and the mnemonic?",b:"Disconnect and hand-bag with 100% O₂. DOPES: Displacement, Obstruction, Pneumothorax, Equipment, Stacked breaths (auto-PEEP). Easy to bag points to the ventilator; hard to bag points to the tube or patient.",link:{t:"case",id:"alarm"},src:["phys"]},
  {id:"c-tension",topic:"trouble",f:"Ventilated, hypotensive, unilateral absent breath sounds, rising plateau right after a line. Next step?",b:"Immediate decompression (needle or finger thoracostomy), then chest tube. Don't wait for imaging.",link:{t:"case",id:"ptx"},src:["phys"]},
  {id:"c-mainstem",topic:"trouble",f:"Plateau up, left breath sounds diminished, tube 4 cm deeper than documented. Diagnosis and fix?",b:"Right mainstem intubation. Withdraw to the documented depth (often about 21 cm at the lip in women, 23 cm in men) and confirm.",link:{t:"case",id:"ptx"},src:["phys"]},
  {id:"c-hyperoxia",topic:"trouble",f:"Saturation recovered on FiO₂ 1.0. What now?",b:"Titrate to the lowest FiO₂ that keeps SpO₂ about 92–96% (ARDS protocols: 88–95%). Prolonged hyperoxia adds risk without benefit.",link:{t:"case",id:"alarm"},src:["ardsnet"]},
  {id:"c-pbw",topic:"basics",f:"Predicted body weight formulas?",b:"Men: 50 + 0.91 × (height cm − 152.4). Women: 45.5 + 0.91 × (height cm − 152.4). Use height, never actual weight.",link:{t:"mission",id:"m-basic"},src:["ardsnet"]},
  {id:"c-pc-vc",topic:"basics",f:"Volume control vs pressure control: what's set and what varies?",b:"Volume control: you set Vt and flow; pressure varies with resistance and compliance. Pressure control: you set pressure and inspiratory time; Vt varies. In pressure control, watch exhaled Vt and minute ventilation alarms.",link:{t:"mission",id:"m-ards"},src:["phys"]},
  {id:"c-co2",topic:"basics",f:"Which settings move PaCO₂? Which move PaO₂?",b:"PaCO₂: alveolar ventilation (RR and Vt) and dead space. PaO₂: FiO₂ and mean airway pressure (mainly PEEP, also inspiratory time).",link:{t:"mission",id:"m-basic"},src:["phys"]},
  {id:"c-measure",topic:"basics",f:"How do you measure plateau pressure and auto-PEEP?",b:"Plateau: inspiratory hold of 0.5–1 s in a passive patient. Auto-PEEP: expiratory hold; total PEEP minus set PEEP.",link:{t:"mission",id:"m-asthma"},src:["phys"]},
  {id:"c-ie",topic:"basics",f:"How do you calculate inspiratory time and I:E in volume control?",b:"Ti = Vt ÷ flow (0.5 L ÷ 1 L/s = 0.5 s). Te = 60/RR − Ti. I:E = Ti : Te.",link:{t:"mission",id:"m-asthma"},src:["phys"]},
  {id:"c-dp",topic:"basics",f:"Driving pressure: definition and target?",b:"Plateau minus PEEP (equal to Vt ÷ compliance). The variable most strongly linked to survival in Amato 2015; many clinicians aim for ≤ 15 cm H₂O.",link:{t:"mission",id:"m-ards"},src:["amato"]},
  {id:"c-lowvt",topic:"ards",f:"ARDS tidal volume and plateau targets, and the trial behind them?",b:"Vt 6 mL/kg PBW (range 4–8), plateau ≤ 30 cm H₂O. ARMA: mortality 31.0% vs 39.8% compared with 12 mL/kg.",link:{t:"case",id:"ards"},src:["ardsnet","fan17"]},
  {id:"c-berlin",topic:"ards",f:"Berlin ARDS severity cutoffs?",b:"On PEEP or CPAP ≥ 5: mild P/F 201–300, moderate 101–200, severe ≤ 100. Onset within 1 week; bilateral opacities; not fully explained by heart failure or fluid overload.",link:{t:"case",id:"ards"},src:["berlin"]},
  {id:"c-global",topic:"ards",f:"What did the 2024 global ARDS definition add?",b:"SpO₂/FiO₂ ≤ 315 (when SpO₂ ≤ 97%) as an alternative to P/F; non-intubated ARDS on high-flow ≥ 30 L/min or NIV/CPAP ≥ 5; ultrasound allowed for imaging; a modified version for resource-limited settings.",link:{t:"q",id:"q16"},src:["global24"]},
  {id:"c-peep",topic:"ards",f:"PEEP strategy in moderate to severe ARDS?",b:"Higher rather than lower PEEP is suggested (conditional). Titrate while keeping plateau ≤ 30, watching driving pressure and blood pressure.",link:{t:"case",id:"ards"},src:["fan17","alveoli"]},
  {id:"c-rm",topic:"ards",f:"Prolonged high-pressure recruitment maneuvers in ARDS?",b:"Recommended against (ATS 2024). ART trial: higher 28-day mortality with aggressive recruitment plus titrated PEEP.",link:{t:"case",id:"ards"},src:["ats24","art"]},
  {id:"c-prone",topic:"ards",f:"Prone positioning: who, how long, and the evidence?",b:"P/F < 150 on FiO₂ ≥ 0.6 and PEEP ≥ 5 after initial optimization. At least 12 h/day (PROSEVA averaged about 17 h). 28-day mortality 16.0% vs 32.8%.",link:{t:"case",id:"ards"},src:["proseva","fan17"]},
  {id:"c-permissive",topic:"ards",f:"Permissive hypercapnia: usual pH floor and key contraindication?",b:"Generally tolerate pH down to about 7.15–7.20 while protecting the lung; raise RR (up to 35) before Vt. Avoid with raised intracranial pressure; caution in RV failure.",link:{t:"case",id:"ards"},src:["ardsnet"]},
  {id:"c-steroids",topic:"ards",f:"Corticosteroids in ARDS?",b:"ATS 2024 suggests corticosteroids for ARDS (conditional recommendation, moderate certainty).",link:{t:"q",id:"q17"},src:["ats24"]},
  {id:"c-fluids",topic:"ards",f:"Fluid strategy once ARDS shock resolves?",b:"Conservative. FACTT: more ventilator-free days, no mortality difference.",link:{t:"case",id:"ards"},src:["factt"]},
  {id:"c-nmb",topic:"ards",f:"Neuromuscular blockade in ARDS?",b:"Not routine. ROSE showed no mortality benefit vs lighter sedation. ATS 2024 suggests NMB in early severe ARDS; ESICM 2023 advises against routine continuous infusion.",link:{t:"case",id:"ards"},src:["rose","ats24","esicm23"]},
  {id:"c-ecmo",topic:"ards",f:"Where does VV-ECMO fit in ARDS?",b:"Suggested for selected patients with severe ARDS (ATS 2024, conditional), after lung-protective ventilation and proning, at experienced centers.",link:{t:"q",id:"q17"},src:["ats24"]},
  {id:"c-autopeep",topic:"obstructive",f:"Hypotension right after intubation in asthma or COPD?",b:"Dynamic hyperinflation (auto-PEEP) until proven otherwise. Disconnect for 30–60 s; if BP recovers, that confirms it. Keep tension pneumothorax on the list.",link:{t:"case",id:"asthma"},src:["phys"]},
  {id:"c-te",topic:"obstructive",f:"Biggest lever to lengthen expiratory time?",b:"Lower the respiratory rate. Smaller gains: shorter Ti (higher inspiratory flow) and smaller Vt.",link:{t:"mission",id:"m-asthma"},src:["phys"]},
  {id:"c-ext-peep",topic:"obstructive",f:"When does adding external PEEP help auto-PEEP?",b:"Spontaneously breathing, flow-limited COPD with missed triggers: set about 75–85% of measured auto-PEEP. Not in a passive asthmatic, where it can add to hyperinflation.",link:{t:"q",id:"q7"},src:["phys"]},
  {id:"c-copd-co2",topic:"obstructive",f:"Chronic CO₂ retainer on the vent: what PaCO₂ do you target?",b:"Their baseline, not 40. Over-ventilation causes alkalemia and renal bicarbonate loss, which makes extubation harder.",link:{t:"mission",id:"m-copd"},src:["phys"]},
  {id:"c-satsbt",topic:"liberation",f:"Evidence for pairing SAT and SBT?",b:"ABC trial: daily paired awakening and breathing trials increased ventilator-free days and lowered 1-year mortality.",link:{t:"case",id:"sbt"},src:["abc"]},
  {id:"c-sbt-method",topic:"liberation",f:"How should the first SBT be run?",b:"Inspiratory pressure augmentation (PS 5–8 cm H₂O) rather than T-piece or CPAP (ACCP/ATS). Subirà 2019: 30-min PS 8 beat a 2-h T-piece for successful extubation.",link:{t:"case",id:"sbt"},src:["ouellette17","subira"]},
  {id:"c-rsbi",topic:"liberation",f:"RSBI formula and cutoff?",b:"RR ÷ Vt in liters. Below 105 predicts success (Yang and Tobin 1991). Clinical tolerance still decides.",link:{t:"case",id:"sbt"},src:["yang"]},
  {id:"c-sbt-fail",topic:"liberation",f:"Signs to stop an SBT?",b:"RR > 35 sustained, SpO₂ < 90%, HR > 140 or a rise > 20%, SBP > 180 or < 90, agitation, diaphoresis, accessory muscle use, change in mental status.",link:{t:"q",id:"q10"},src:["ouellette17"]},
  {id:"c-cuffleak",topic:"liberation",f:"Cuff leak test: who gets one, and what if there's no leak?",b:"High risk for stridor: traumatic intubation, intubation > 6 days, large tube, female sex, reintubation after unplanned extubation. No leak but otherwise ready: systemic steroids at least 4 h before extubation; no need to repeat the test.",link:{t:"case",id:"sbt"},src:["girard17"]},
  {id:"c-postext",topic:"liberation",f:"Post-extubation support for high-risk patients?",b:"Preventive NIV right after extubation (ACCP/ATS), especially in hypercapnic patients. HIGH-WEAN: high-flow plus NIV cut day-7 reintubation vs high-flow alone (11.8% vs 18.2%).",link:{t:"case",id:"sbt"},src:["ouellette17","thille"]},
  {id:"c-niv-strong",topic:"niv",f:"Two settings with strong recommendations for NIV?",b:"Hypercapnic COPD exacerbation with pH ≤ 7.35, and cardiogenic pulmonary edema (bilevel or CPAP).",link:{t:"q",id:"q13"},src:["niv17"]},
  {id:"c-niv-contra",topic:"niv",f:"Contraindications to NIV?",b:"Arrest or need for emergent intubation, unable to protect airway or clear secretions, vomiting or upper GI bleed, facial trauma, severe agitation, hemodynamic instability.",link:{t:"q",id:"q13"},src:["niv17"]},
  {id:"c-padis",topic:"niv",f:"PADIS approach to sedation on the vent?",b:"Analgesia first, then light sedation (RASS −2 to 0). Propofol or dexmedetomidine over benzodiazepines.",link:{t:"q",id:"q15"},src:["padis"]}
];

  debrief:["Set Vt by PBW (6 mL/kg; range 4–8). Keep plateau ≤ 30; many aim for driving pressure ≤ 15.","Moderate to severe ARDS: higher PEEP. Avoid prolonged high-pressure recruitment maneuvers.","P/F < 150 despite optimization: prone ≥ 12 h/day, started early.","Accept permissive hypercapnia; raise RR (up to 35) before Vt.","Corticosteroids (conditional), conservative fluids after shock, VV-ECMO for selected severe cases at experienced centers."],

 {id:"asthma",topic:"obstructive",title:"The hypotensive asthmatic",teaser:"BP crashes right after intubation for status asthmaticus. Find the trapped air.",mins:4,
  nodes:{
   start:{mon:{hr:134,bp:"72/40",spo2:91,pp:"62",vent:"VC · Vt 550 · RR 26 · PEEP 5 · Flow 50 L/min"},
    text:"28-year-old man with status asthmaticus, intubated 10 minutes ago after rapid hand-bagging. BP now 72/40, HR 134. His chest looks hyperexpanded, breath sounds are distant on both sides, and the trachea is midline.",
    q:"Most likely cause of the hypotension?",
    c:[
     {t:"Dynamic hyperinflation (auto-PEEP) reducing venous return",g:"best",fb:"Air trapped by incomplete exhalation raises intrathoracic pressure and cuts venous return. Classic after aggressive bagging in obstructive disease. Bilateral findings favor this over tension pneumothorax, which stays on the list.",next:"n2",cards:["c-autopeep"]},
     {t:"Septic shock",g:"bad",fb:"No infection history, and the timing right after intubation and bagging points to the ventilator.",next:"n2",cards:["c-autopeep"]},
     {t:"Anaphylaxis to the induction drug",g:"ok",fb:"Possible but less likely without rash or other signs. Timing with fast bagging fits auto-PEEP.",next:"n2",cards:["c-autopeep"]}]},
   n2:{mon:{hr:134,bp:"72/40",spo2:91,pp:"62",vent:"VC · Vt 550 · RR 26 · PEEP 5 · Flow 50 L/min"},
    text:"You suspect auto-PEEP.",
    q:"What's the fastest test and treatment?",
    c:[
     {t:"Disconnect from the ventilator for 30–60 seconds, then reassess",g:"best",fb:"If BP rises within seconds, you've confirmed dynamic hyperinflation. Some clinicians add gentle chest compression during exhalation.",next:"n3",cards:["c-autopeep"]},
     {t:"2 L fluid bolus and start norepinephrine",g:"ok",fb:"Fluids and pressors support preload but don't remove the trapped air. Disconnect first.",next:"n3"},
     {t:"Increase RR to 32 to treat the respiratory acidosis",g:"bad",fb:"This shortens expiratory time and worsens air trapping, potentially to cardiac arrest.",next:"n3",cards:["c-te"]}]},
   n3:{mon:{hr:112,bp:"108/66",spo2:93,pp:"58 / 28",vent:"VC · Vt 550 · RR 26 · PEEP 5 · Flow 50 L/min"},
    text:"After 40 seconds off the vent, BP recovers to 108/66. Back on: expiratory hold shows total PEEP 19 (auto-PEEP 14). Peak 58, plateau 28.",
    q:"Which change lengthens expiratory time the most?",
    c:[
     {t:"Lower RR from 26 to 12",g:"best",fb:"Rate drives expiratory time. At RR 26 each breath gets 2.3 s total; at RR 12 it gets 5 s. Higher inspiratory flow only trims tenths of a second.",next:"n4",cards:["c-te"]},
     {t:"Raise inspiratory flow from 50 to 80 L/min",g:"ok",fb:"Helps a little (Ti falls from 0.66 to 0.41 s), but lowering the rate does far more. Peak pressure will rise with higher flow, which is fine if plateau is safe.",next:"n4",cards:["c-te","c-ie"]},
     {t:"Raise PEEP to 15 to match the auto-PEEP",g:"bad",fb:"In a passive, sedated asthmatic, external PEEP can add to total PEEP and worsen hyperinflation. Matching PEEP is a trigger-assist strategy for spontaneously breathing COPD patients.",next:"n4",cards:["c-ext-peep"]},
     {t:"Raise tidal volume to 700 mL for better CO₂ clearance",g:"bad",fb:"Bigger breaths take longer to exhale and raise plateau.",next:"n4",cards:["c-te"]}]},
   n4:{mon:{hr:104,bp:"118/70",spo2:94,pp:"50 / 22",vent:"VC · Vt 450 · RR 12 · PEEP 5 · Flow 80 L/min"},
    text:"Now Vt 450, RR 12, flow 80. Auto-PEEP 3, plateau 22. ABG 7.18 / PaCO₂ 70.",
    q:"How do you respond to the ABG?",
    c:[
     {t:"Accept permissive hypercapnia while plateau and auto-PEEP stay low; continue bronchodilators, steroids, and adequate sedation",g:"best",fb:"Hypercapnia is generally tolerated (pH about 7.15–7.20 or higher) without raised intracranial pressure. CO₂ falls as bronchospasm resolves.",next:null,cards:["c-permissive"]},
     {t:"Raise RR back to 24 to normalize PaCO₂",g:"bad",fb:"This recreates the problem you just fixed.",next:null,cards:["c-te"]},
     {t:"Bicarbonate infusion to pH 7.40",g:"bad",fb:"Not routine, and bicarbonate generates CO₂ he can't clear.",next:null,cards:["c-permissive"]}]}
  },
  debrief:["Obstructive physiology needs time to exhale: low RR, modest Vt, high inspiratory flow (short Ti).","Hypotension after intubation in asthma or COPD: think auto-PEEP first. Disconnect to test and treat; consider tension pneumothorax.","Measure plateau with an inspiratory hold and auto-PEEP with an expiratory hold. In bronchospasm, peak pressure overstates lung stress.","Permissive hypercapnia is a deliberate trade to avoid hyperinflation."],
  refs:["phys"]},

 {id:"sbt",topic:"liberation",title:"Ready to come off?",teaser:"Day 4 on the vent with COPD. Run the awakening and breathing trials, then plan the extubation.",mins:5,
  nodes:{
   start:{mon:{hr:84,bp:"124/70",spo2:96,pp:"22 / 17",vent:"VC · Vt 450 · RR 16 · PEEP 5 · FiO₂ 0.40 · propofol"},
    text:"71-year-old man with COPD, ventilated 4 days for pneumonia. Off vasopressors, FiO₂ 0.40, PEEP 5, secretions manageable. Propofol infusion, RASS −3.",
    q:"What's the plan this morning?",
    c:[
     {t:"Spontaneous awakening trial, and if he passes, a spontaneous breathing trial",g:"best",fb:"Pairing a daily SAT with an SBT (ABC trial) increased ventilator-free days and lowered 1-year mortality. Guidelines suggest protocols that minimize sedation and protocolized liberation.",next:"n2",cards:["c-satsbt","c-padis"]},
     {t:"Keep him sedated until the chest X-ray clears",g:"bad",fb:"X-rays lag recovery. Readiness is clinical: improving cause, FiO₂ ≤ 0.4–0.5, PEEP ≤ 5–8, stable hemodynamics, able to trigger breaths.",next:"n2",cards:["c-satsbt"]},
     {t:"Extubate now; his settings are low",g:"bad",fb:"He needs to show he can breathe with minimal support and protect his airway. Run an SBT first.",next:"n2",cards:["c-satsbt"]}]},
   n2:{mon:{hr:88,bp:"130/72",spo2:96,pp:"22 / 17",vent:"VC · Vt 450 · RR 16 · PEEP 5 · FiO₂ 0.40 · sedation off"},
    text:"SAT passed: RASS 0, follows commands, no agitation.",
    q:"How should you run the SBT?",
    c:[
     {t:"Pressure support 5–8 cm H₂O (PEEP 0–5) for 30 minutes",g:"best",fb:"ACCP/ATS suggest inspiratory pressure augmentation over T-piece or CPAP for the first SBT. Subirà 2019: 30-min PS 8 led to more successful extubations than a 2-h T-piece.",next:"n3",cards:["c-sbt-method"]},
     {t:"T-piece for 2 hours",g:"ok",fb:"Valid and widely used, but more demanding. Pressure support for 30 minutes is now suggested for the first trial.",next:"n3",cards:["c-sbt-method"]},
     {t:"CPAP 5 overnight to see how he does",g:"bad",fb:"Too long. Prolonged trials can tire patients without adding prognostic information.",next:"n3",cards:["c-sbt-method"]}]},
   n3:{mon:{hr:92,bp:"132/74",spo2:95,pp:"13",vent:"PSV · PS 8 · PEEP 5 · FiO₂ 0.40"},
    text:"After 30 minutes: RR 24, Vt 380 mL, SpO₂ 95%, HR 92 (was 84). No accessory muscle use. Calm.",
    q:"How do you interpret the trial?",
    c:[
     {t:"Passed: RSBI = 24 ÷ 0.38 ≈ 63, below 105, with no signs of intolerance",g:"best",fb:"RSBI < 105 predicted weaning success in Yang and Tobin. Clinical tolerance matters more: watch for RR > 35, SpO₂ < 90%, HR > 140 or a rise > 20%, SBP > 180 or < 90, agitation, diaphoresis.",next:"n4",cards:["c-rsbi","c-sbt-fail"]},
     {t:"Failed, because RR is above 20",g:"bad",fb:"RR 24 is fine. Failure usually means RR above 35 sustained, with distress.",next:"n4",cards:["c-sbt-fail"]},
     {t:"Can't tell without an ABG",g:"ok",fb:"An ABG isn't required when he's comfortable and well saturated, though it's reasonable in a CO₂ retainer.",next:"n4",cards:["c-rsbi"]}]},
   n4:{mon:{hr:90,bp:"128/72",spo2:95,pp:"13",vent:"PSV · PS 8 · PEEP 5 · FiO₂ 0.40"},
    text:"He passed. He was intubated on the first attempt with a 7.5 tube 4 days ago, with no airway trauma.",
    q:"Does he need a cuff leak test?",
    c:[
     {t:"Not routinely; save it for patients at high risk of post-extubation stridor",g:"best",fb:"Guidelines suggest a cuff leak test for high-risk patients (traumatic intubation, > 6 days, large tube, female sex, reintubation after unplanned extubation). No leak but otherwise ready: systemic steroids at least 4 h before extubation, without retesting.",next:"n5",cards:["c-cuffleak"]},
     {t:"Yes, everyone needs one before extubation",g:"bad",fb:"Not required for everyone. Low-risk patients can be extubated without it.",next:"n5",cards:["c-cuffleak"]},
     {t:"Skip the test and give everyone steroids",g:"bad",fb:"Steroids are for high-risk patients who fail a cuff leak test.",next:"n5",cards:["c-cuffleak"]}]},
   n5:{mon:{hr:90,bp:"128/72",spo2:95,pp:"13",vent:"PSV · PS 8 · PEEP 5 · FiO₂ 0.40"},
    text:"He has COPD and was hypercapnic when intubated.",
    q:"What support after extubation?",
    c:[
     {t:"Extubate directly to NIV (high-flow between sessions is reasonable)",g:"best",fb:"ACCP/ATS suggest preventive NIV right after extubation in high-risk patients, with the clearest benefit in hypercapnia. HIGH-WEAN: high-flow plus NIV cut day-7 reintubation vs high-flow alone (11.8% vs 18.2%).",next:null,cards:["c-postext"]},
     {t:"Nasal cannula 2 L and observe",g:"ok",fb:"Fine for low-risk patients. COPD and hypercapnia make him high risk, where preventive NIV helps.",next:null,cards:["c-postext"]},
     {t:"Wait another 24 hours to be safe",g:"bad",fb:"Unnecessary delay adds ventilator days, pneumonia risk, and delirium.",next:null,cards:["c-satsbt"]}]}
  },
  debrief:["Daily paired SAT and SBT, run by protocol.","First SBT: pressure support 5–8 for 30 minutes (T-piece is an alternative).","RSBI < 105 supports readiness; clinical tolerance decides.","Cuff leak test only for high-risk patients; steroids at least 4 h before extubation if there's no leak.","High risk (age > 65, COPD, heart disease, hypercapnia): extubate to NIV, with or without high-flow."],
  refs:["abc","ouellette17","girard17","subira","yang","thille","padis"]},

 {id:"ptx",topic:"trouble",title:"Desaturation after a line",teaser:"Pressures jump right after a subclavian line. Then, two days later, a quieter problem.",mins:3,
  nodes:{
   start:{mon:{hr:136,bp:"84/50",spo2:80,pp:"52 / 46",vent:"VC · Vt 380 · RR 28 · PEEP 12 · FiO₂ 0.50"},
    text:"48-year-old man with ARDS, day 3. Ten minutes after a left subclavian central line, SpO₂ drops to 80% and BP to 84/50. Peak went from 32 to 52; plateau from 26 to 46. Breath sounds are absent on the left.",
    q:"What does the pressure pattern tell you?",
    c:[
     {t:"Peak and plateau rose together (same gap): compliance fell",g:"best",fb:"Peak minus plateau is 6 cm H₂O, same as before. The respiratory system got stiffer: pneumothorax, mainstem intubation, lobar collapse, edema, or abdominal distension.",next:"n2",cards:["c-pplat-high"]},
     {t:"A resistance problem; suction him",g:"bad",fb:"With a resistance problem, plateau would stay near 26. It jumped to 46.",next:"n2",cards:["c-ppeak-pplat","c-pplat-high"]}]},
   n2:{mon:{hr:138,bp:"80/48",spo2:79,pp:"52 / 46",vent:"VC · Vt 380 · RR 28 · PEEP 12 · FiO₂ 1.0"},
    text:"Trachea is now shifted to the right.",
    q:"Next step?",
    c:[
     {t:"Immediate needle decompression or finger thoracostomy on the left, then a chest tube",g:"best",fb:"Tension pneumothorax on positive pressure is a clinical diagnosis: hypotension, unilateral absent breath sounds, rising plateau, recent procedure. Don't wait for imaging.",next:"n3",cards:["c-tension"]},
     {t:"Stat chest X-ray to confirm first",g:"bad",fb:"Waiting for imaging in an unstable ventilated patient risks arrest.",next:"n3",cards:["c-tension"]},
     {t:"Raise PEEP to recruit the left lung",g:"bad",fb:"More intrathoracic pressure worsens tension physiology.",next:"n3",cards:["c-tension"]}]},
   n3:{mon:{hr:98,bp:"112/66",spo2:89,pp:"37 / 31",vent:"VC · Vt 380 · RR 28 · PEEP 12 · FiO₂ 0.50"},
    text:"Chest tube in; he stabilizes. Two days later, after a turn, SpO₂ drifts to 89% and plateau rises from 26 to 31. Left breath sounds are diminished; BP is fine. The tube reads 27 cm at the lip (documented 23 cm).",
    q:"Most likely problem and fix?",
    c:[
     {t:"Right mainstem intubation: pull the tube back to the documented depth and confirm with exam and imaging",g:"best",fb:"Tubes migrate during turns. A 4 cm advance can enter the right mainstem, overinflating the right lung while the left collapses.",next:null,cards:["c-mainstem"]},
     {t:"Recurrent pneumothorax: place a second chest tube",g:"bad",fb:"Check the simple things first. The tube depth changed by 4 cm.",next:null,cards:["c-mainstem"]},
     {t:"Raise PEEP to 16",g:"bad",fb:"Doesn't fix the displaced tube and adds pressure to the right lung.",next:null,cards:["c-mainstem"]}]}
  },
  debrief:["Both pressures up with the same gap: compliance problem. Wider gap: resistance problem.","Ventilated patient + hypotension + unilateral breath sounds after a procedure = tension pneumothorax until proven otherwise.","Check and document tube depth at the lip every shift and after every move."],
  refs:["phys"]}
];

const QUESTIONS = [
 {id:"q1",topic:"basics",stem:"A 72-year-old woman, 157 cm and 92 kg, is intubated for ARDS after aspiration. Which initial tidal volume best follows lung-protective guidance?",opts:["560 mL","480 mL","420 mL","300 mL","220 mL"],ans:3,
  ex:"PBW (female) = 45.5 + 0.91 × (157 − 152.4) ≈ 49.7 kg, so 6 mL/kg ≈ 300 mL. Actual weight doesn't matter because lungs scale with height. 560 mL is about 6 mL/kg of actual weight, a common error.",refs:["ardsnet","fan17"],cards:["c-pbw","c-lowvt"]},
 {id:"q2",topic:"trouble",stem:"A ventilated patient with pneumonia triggers a high-pressure alarm. Peak 46 cm H₂O (baseline 30); plateau on inspiratory hold 20 (baseline 19). SpO₂ 90%. What is the most appropriate next step?",opts:["Needle decompression of the chest","Pass a suction catheter through the endotracheal tube","Increase PEEP","Furosemide IV","CT pulmonary angiogram"],ans:1,
  ex:"Peak rose while plateau stayed flat, so resistance increased: secretions, plug, kink, biting, or bronchospasm. Suctioning tests tube patency and treats the most common cause. Pneumothorax and edema would raise plateau.",refs:["phys"],cards:["c-ppeak-pplat","c-dope"]},
 {id:"q3",topic:"ards",stem:"ARDS on volume control: Vt 6 mL/kg PBW, RR 26, PEEP 14, FiO₂ 0.5. Plateau 27. ABG 7.19 / PaCO₂ 66 / PaO₂ 78. No auto-PEEP on expiratory hold. Best next step?",opts:["Increase Vt to 8 mL/kg","Increase RR to 34","Start a bicarbonate infusion","Decrease PEEP to 8","Start inhaled epoprostenol"],ans:1,
  ex:"The ARMA protocol raises rate (up to 35) for acidosis before touching tidal volume. Without auto-PEEP, a faster rate is safe. Increasing Vt risks plateau > 30. Bicarbonate isn't first line.",refs:["ardsnet","fan17"],cards:["c-permissive","c-co2"]},
 {id:"q4",topic:"ards",stem:"After 12 hours of optimized lung-protective ventilation (Vt 6 mL/kg, PEEP 16, FiO₂ 0.7), a patient with ARDS has PaO₂ 80 (P/F 114) and plateau 28. Which intervention has shown a mortality benefit here?",opts:["Prone positioning ≥ 12 h/day","Inhaled nitric oxide","High-frequency oscillatory ventilation","Prolonged recruitment maneuver at 40 cm H₂O","Routine pulmonary artery catheter"],ans:0,
  ex:"PROSEVA (P/F < 150, FiO₂ ≥ 0.6, PEEP ≥ 5): 28-day mortality 16.0% vs 32.8% with early prolonged proning. Inhaled NO improves oxygenation without survival benefit; HFOV and prolonged recruitment maneuvers are recommended against.",refs:["proseva","fan17","ats24"],cards:["c-prone","c-rm"]},
 {id:"q5",topic:"obstructive",stem:"A 66-year-old with severe COPD (home ABG: PaCO₂ 60, HCO₃ 34) is intubated for pneumonia. On VC Vt 500, RR 20, ABG is 7.58 / PaCO₂ 36 / HCO₃ 33. Best adjustment?",opts:["No change; PaCO₂ is normal","Decrease RR to target his baseline PaCO₂","Increase PEEP","Give acetazolamide","Increase Vt"],ans:1,
  ex:"Normalizing PaCO₂ in a chronic retainer causes alkalemia, and the kidneys then excrete bicarbonate, setting him up to fail extubation. Target his baseline. A lower rate also lengthens expiratory time.",refs:["phys"],cards:["c-copd-co2"]},
 {id:"q6",topic:"obstructive",stem:"Right after intubation for severe asthma with vigorous bag ventilation, BP falls from 128/80 to 70/40. Breath sounds are diminished bilaterally; trachea midline. Best immediate step?",opts:["Disconnect from the ventilator and allow passive exhalation","Increase RR","2 L crystalloid bolus","Bilateral chest tubes","Increase PEEP to 12"],ans:0,
  ex:"Dynamic hyperinflation is the leading cause. Disconnecting for 30–60 s is diagnostic and therapeutic. Faster rate or more PEEP worsens trapping. Bilateral tension pneumothorax is rare; reassess if disconnection doesn't help.",refs:["phys"],cards:["c-autopeep"]},
 {id:"q7",topic:"obstructive",stem:"A spontaneously breathing COPD patient on pressure support makes visible inspiratory efforts that fail to trigger the ventilator. Expiratory hold auto-PEEP is 8 cm H₂O with set PEEP 0. Which change most likely reduces missed triggers?",opts:["Increase pressure support","Apply external PEEP of about 6 cm H₂O","Make the trigger less sensitive","Increase sedation","Increase FiO₂"],ans:1,
  ex:"The patient must overcome auto-PEEP before the ventilator senses effort. External PEEP at about 75–85% of auto-PEEP narrows that gap in flow-limited COPD. More pressure support can increase Vt and worsen trapping.",refs:["phys"],cards:["c-ext-peep"]},
 {id:"q8",topic:"basics",stem:"A patient on pressure control (inspiratory pressure 15 above PEEP 10, RR 20) develops worsening pulmonary edema. What will the ventilator show?",opts:["Peak pressure rises; Vt unchanged","Peak pressure unchanged; Vt falls","Both peak pressure and Vt rise","Inspiratory flow rises","Plateau falls"],ans:1,
  ex:"In pressure control, pressure is fixed and volume is the dependent variable. Lower compliance means less volume for the same pressure. In volume control it's the reverse: Vt fixed, pressures rise.",refs:["phys"],cards:["c-pc-vc"]},
 {id:"q9",topic:"basics",stem:"In a multilevel analysis of ARDS trials (Amato 2015), which ventilator variable was most strongly associated with survival?",opts:["Tidal volume in mL/kg PBW","PEEP","Plateau pressure","Driving pressure (plateau − PEEP)","FiO₂"],ans:3,
  ex:"Driving pressure (Vt normalized to compliance) best stratified risk. Changes in Vt or PEEP were beneficial only when they lowered driving pressure.",refs:["amato"],cards:["c-dp"]},
 {id:"q10",topic:"liberation",stem:"Which finding during a 30-minute pressure support SBT should make you stop the trial?",opts:["RR 26 with Vt 400 mL","HR rising from 88 to 96","RR 38 with accessory muscle use and diaphoresis","SpO₂ 93% on FiO₂ 0.4","PaCO₂ 44"],ans:2,
  ex:"Failure criteria include sustained RR > 35, SpO₂ < 90%, HR > 140 or a rise > 20%, SBP > 180 or < 90, and signs of distress such as accessory muscle use, diaphoresis, or agitation.",refs:["ouellette17"],cards:["c-sbt-fail"]},
 {id:"q11",topic:"liberation",stem:"During an SBT: RR 32, Vt 250 mL. What is the RSBI and what does it suggest?",opts:["32; predicts success","78; predicts success","128; predicts failure","8; predicts failure","250; predicts failure"],ans:2,
  ex:"RSBI = RR ÷ Vt in liters = 32 ÷ 0.25 = 128. Values above 105 predicted weaning failure in Yang and Tobin's study.",refs:["yang"],cards:["c-rsbi"]},
 {id:"q12",topic:"liberation",stem:"Which patient is the best candidate for a cuff leak test before extubation?",opts:["55-year-old man, 2 days intubated, uneventful intubation","68-year-old woman intubated 8 days after a traumatic, multiple-attempt intubation","40-year-old man after elective surgery","Any patient with COPD","A patient with a tracheostomy"],ans:1,
  ex:"Guidelines suggest a cuff leak test for patients at high risk of stridor: traumatic intubation, intubation > 6 days, large tube, female sex, reintubation after unplanned extubation. If there's no leak, give systemic steroids at least 4 h before extubation.",refs:["girard17"],cards:["c-cuffleak"]},
 {id:"q13",topic:"niv",stem:"A 70-year-old with a COPD exacerbation: RR 30, ABG 7.28 / PaCO₂ 68 / PaO₂ 58 on 2 L. Alert and protecting his airway. Best next step?",opts:["High-flow nasal oxygen 60 L/min","Bilevel noninvasive ventilation","Immediate intubation","Non-rebreather mask","IV bicarbonate"],ans:1,
  ex:"Bilevel NIV is strongly recommended for acute hypercapnic COPD exacerbation with pH ≤ 7.35. It lowers intubation and mortality. He has no contraindications.",refs:["niv17"],cards:["c-niv-strong","c-niv-contra"]},
 {id:"q14",topic:"niv",stem:"In which setting does the ERS/ATS guideline make a strong recommendation for NIV?",opts:["De novo hypoxemic respiratory failure","Cardiogenic pulmonary edema","Asthma exacerbation","Post-extubation in low-risk patients","Chest trauma without hypoxemia"],ans:1,
  ex:"Strong recommendations: hypercapnic COPD exacerbation (pH ≤ 7.35) and cardiogenic pulmonary edema. Conditional: immunocompromised, post-operative, palliation, chest trauma, high-risk post-extubation. No recommendation was made for asthma or de novo hypoxemic failure.",refs:["niv17"],cards:["c-niv-strong"]},
 {id:"q15",topic:"niv",stem:"Which sedation approach for a mechanically ventilated adult does the SCCM PADIS guideline suggest?",opts:["Benzodiazepine infusion targeting RASS −4","Light sedation with propofol or dexmedetomidine rather than benzodiazepines","Routine deep sedation for the first 72 hours","Haloperidol as first-line sedative","Ketamine for all patients"],ans:1,
  ex:"PADIS suggests analgesia-first, light sedation, and propofol or dexmedetomidine over benzodiazepines. Pair with daily awakening and breathing trials.",refs:["padis","abc"],cards:["c-padis"]},
 {id:"q16",topic:"ards",stem:"On high-flow nasal oxygen 40 L/min, FiO₂ 0.6, SpO₂ 94%, a patient has new bilateral opacities from pneumonia without heart failure. Under the 2024 global ARDS definition, which is true?",opts:["Can't be ARDS without intubation","Meets ARDS criteria (SpO₂/FiO₂ ≈ 157, ≤ 315)","Requires CT to diagnose","Requires a P/F ratio; SpO₂ can't be used","Requires PEEP ≥ 10"],ans:1,
  ex:"The global definition includes non-intubated patients on high-flow ≥ 30 L/min and accepts SpO₂/FiO₂ ≤ 315 when SpO₂ ≤ 97%. Here 94 ÷ 0.6 ≈ 157.",refs:["global24"],cards:["c-global"]},
 {id:"q17",topic:"ards",stem:"Which therapy received a conditional recommendation FOR use in the 2024 ATS ARDS guideline update?",opts:["Routine high-frequency oscillatory ventilation","Corticosteroids","Prolonged high-pressure recruitment maneuvers","Inhaled nitric oxide for all patients","Liberal fluid strategy"],ans:1,

/* ================= PHYSIOLOGY MODEL ================= */
function pbw(sex,cm){return (sex==="M"?50:45.5)+0.91*(cm-152.4)}
function sevSat(p){p=Math.max(p,1);return 1/(23400/(p*p*p+150*p)+1)}
function physio(pt,s){
  const C=pt.C,R=pt.R,tau=R*C/1000,ttot=60/s.rr;
  let ti,vt,ai=0,flowLs=0,trap=0;
  if(s.mode==="VC"){flowLs=s.flow/60;vt=s.vt;ti=(vt/1000)/flowLs}else{ti=s.ti;vt=0}
  let te=ttot-ti;const inverse=te<ti;te=Math.max(te,0.25);
  const k=Math.exp(-te/tau);
  if(s.mode==="VC"){trap=vt*k/(1-k);ai=trap/C}
  else{for(let i=0;i<40;i++){vt=C*Math.max(0,s.pinsp-ai)*(1-Math.exp(-ti/tau));trap=vt*k/(1-k);ai=trap/C}}
  const peepTot=s.peep+ai,pplat=peepTot+vt/C;
  const ppeak=s.mode==="VC"?pplat+R*flowLs:s.peep+s.pinsp;
  const peakFlow=s.mode==="VC"?s.flow:(C*Math.max(0,s.pinsp-ai)/1000/tau)*60;
  const vd=pt.vd+Math.max(0,pplat-30)*4+pt.trapVd*ai;
  const va=Math.max(0.3,s.rr*Math.max(vt-vd,15)/1000);
  const paco2=Math.min(150,0.863*pt.vco2/va);
  const hco3=pt.hco3+0.1*(paco2-40);
  const ph=6.1+Math.log10(hco3/(0.03*paco2));
  let qs=pt.shunt*(1-pt.rec*(1-Math.exp(-peepTot/7)))+Math.max(0,pplat-30)*0.006;
  qs=Math.min(0.65,Math.max(0.02,qs));
  const pA=Math.max(30,s.fio2*713-paco2/0.8),hb=10;
  const cc=1.34*hb*sevSat(pA)+0.003*pA,ca=cc-5*qs/(1-qs);
  let lo=5,hi=700;for(let i=0;i<40;i++){const mid=(lo+hi)/2;if(1.34*hb*sevSat(mid)+0.003*mid>ca)hi=mid;else lo=mid}
  const pao2=(lo+hi)/2,spo2=sevSat(pao2)*100;
  const map=pt.map0-0.9*Math.max(0,peepTot-10)-3*Math.max(0,ai-4);
  const hr=pt.hr0+Math.max(0,65-map)*0.9+(spo2<88?(88-spo2)*0.6:0);
  return {vt,ti,te,tau,trap,ai,peepTot,pplat,ppeak,peakFlow,flowLs,dp:pplat-peepTot,paco2,ph,hco3,pao2,spo2,pf:pao2/s.fio2,map,hr,ve:vt*s.rr/1000,vtkg:vt/pbw(pt.sex,pt.cm),inverse,ttot,C,R};
}

/* ================= STORAGE (account sync + device fallback) ================= */
const LS_KEY="plateau.v1";
function blankState(){return {xp:0,streak:{last:null,count:0},cards:{},qs:{},cases:{},missions:{},newToday:{d:null,n:0},updatedAt:0}}
let S=blankState();
let syncMode="device";
try{const raw=localStorage.getItem(LS_KEY);if(raw){S=Object.assign(blankState(),JSON.parse(raw))}}catch(e){}
let cloudRef=null,cloudBusy=false,cloudQueued=false,cloudTimer=null;
function save(){
  S.updatedAt=Date.now();
  try{localStorage.setItem(LS_KEY,JSON.stringify(S))}catch(e){}
  if(cloudRef){clearTimeout(cloudTimer);cloudTimer=setTimeout(pushCloud,1200)}
}
async function pushCloud(){
  if(!cloudRef)return;
  if(cloudBusy){cloudQueued=true;return}
  cloudBusy=true;
  try{await cloudRef.set(JSON.parse(JSON.stringify(S)));syncMode="account"}catch(e){syncMode="device"}
  cloudBusy=false;renderHeader();
  if(cloudQueued){cloudQueued=false;pushCloud()}
}
async function initCloud(){
  try{
    if(!(window.claude&&typeof window.claude.use==="function"))return;
    const [user,db]=await Promise.all([window.claude.use("user"),window.claude.use("db")]);
    if(!user||!db)return;
    const id=await user.id();if(!id)return;
    const ref=db.collection("data/users/"+id).doc("progress");
    const snap=await Promise.race([ref.get(),new Promise((_,rej)=>setTimeout(()=>rej(new Error("timeout")),10000))]);
    cloudRef=ref;syncMode="account";
    if(snap.exists){const d=snap.data()||{};if((d.updatedAt||0)>(S.updatedAt||0)){S=Object.assign(blankState(),JSON.parse(JSON.stringify(d)));try{localStorage.setItem(LS_KEY,JSON.stringify(S))}catch(e){}route()}else if((S.updatedAt||0)>(d.updatedAt||0)){pushCloud()}}
    else if(S.updatedAt){pushCloud()}
    renderHeader();
  }catch(e){syncMode="device";renderHeader()}
}

/* ================= PROGRESS HELPERS ================= */
const LEVELS=[[0,"Intern"],[200,"Resident"],[600,"Senior resident"],[1200,"Fellow"],[2200,"Attending"],[3500,"Intensivist"]];
function level(){let i=0;for(let j=0;j<LEVELS.length;j++)if(S.xp>=LEVELS[j][0])i=j;const next=LEVELS[i+1];return {name:LEVELS[i][1],next:next?next[0]:null,cur:LEVELS[i][0]}}
function today(){const d=new Date();return d.getFullYear()+"-"+String(d.getMonth()+1).padStart(2,"0")+"-"+String(d.getDate()).padStart(2,"0")}
function touchStreak(){const t=today();if(S.streak.last===t)return;const y=new Date();y.setDate(y.getDate()-1);const ys=y.getFullYear()+"-"+String(y.getMonth()+1).padStart(2,"0")+"-"+String(y.getDate()).padStart(2,"0");S.streak.count=S.streak.last===ys?S.streak.count+1:1;S.streak.last=t}
function addXP(n){S.xp+=n;touchStreak();save();renderHeader()}
const DAY=86400000,NEW_PER_DAY=10;
function boostCards(ids,from){const now=Date.now();(ids||[]).forEach(id=>{if(!CARDS.find(c=>c.id===id))return;const st=S.cards[id]||{ivl:0,ef:2.5,reps:0,lapses:0};st.due=now;st.boost=from;S.cards[id]=st})}
function newCount(){if(S.newToday.d!==today())return 0;return S.newToday.n}
function reviewQueue(){
  const now=Date.now();
  const due=CARDS.filter(c=>S.cards[c.id]&&S.cards[c.id].due<=now).sort((a,b)=>(S.cards[b.id].boost?1:0)-(S.cards[a.id].boost?1:0)||S.cards[a.id].due-S.cards[b.id].due);
  const fresh=CARDS.filter(c=>!S.cards[c.id]).slice(0,Math.max(0,NEW_PER_DAY-newCount()));
  return due.concat(fresh);
}
function dueCount(){return reviewQueue().length}
function nextIntervals(st){
  st=st||{ivl:0,ef:2.5,reps:0};
  const r=q=>{if(q===0)return 10/1440;if(st.reps===0)return q===3?1:q===4?1:3;if(st.reps===1)return q===3?2:q===4?3:5;return Math.max(1,Math.round(st.ivl*st.ef*(q===3?0.8:q===5?1.3:1)))};
  return [0,3,4,5].map(r);
}
function grade(card,q){
  const isNew=!S.cards[card.id];
  const st=S.cards[card.id]||{ivl:0,ef:2.5,reps:0,lapses:0};
  const [a,h,g,e]=nextIntervals(st);
  if(q===0){st.reps=0;st.ivl=0;st.lapses=(st.lapses||0)+1;st.due=Date.now()+10*60000}
  else{st.ivl=q===3?h:q===4?g:e;st.ef=Math.max(1.3,st.ef+0.1-(5-q)*(0.08+(5-q)*0.02));st.reps++;st.due=Date.now()+st.ivl*DAY}
  delete st.boost;S.cards[card.id]=st;
  if(isNew){if(S.newToday.d!==today())S.newToday={d:today(),n:0};S.newToday.n++}
  addXP(q===0?1:2);
}
function fmtIvl(d){if(d<1)return Math.round(d*1440)+"m";if(d<30)return Math.round(d)+"d";return Math.round(d/30)+"mo"}
function mastery(topic){
  const sig=[];
  const qs=QUESTIONS.filter(q=>q.topic===topic);
  if(qs.length){const ans=qs.filter(q=>S.qs[q.id]);if(ans.length)sig.push(ans.filter(q=>S.qs[q.id].first).length/qs.length)}
  const cs=CASES.filter(c=>c.topic===topic);
  if(cs.length){const done=cs.filter(c=>S.cases[c.id]);if(done.length)sig.push(cs.reduce((a,c)=>a+((S.cases[c.id]&&S.cases[c.id].best)||0),0)/100/cs.length)}
  const cd=CARDS.filter(c=>c.topic===topic);
  if(cd.length){const seen=cd.filter(c=>S.cards[c.id]&&S.cards[c.id].reps>0);if(seen.length)sig.push(cd.reduce((a,c)=>a+Math.min(1,((S.cards[c.id]&&S.cards[c.id].ivl)||0)/21),0)/cd.length)}
  return sig.length?sig.reduce((a,b)=>a+b,0)/sig.length:0;
}

  view.querySelectorAll("[data-ch]").forEach(b=>b.addEventListener("click",()=>{
    const i=+b.dataset.ch,ch=n.c[i];CS.picked=i;CS.max+=10;CS.score+=ch.g==="best"?10:ch.g==="ok"?5:0;
    if(ch.g!=="best"){const ids=[...(ch.cards||[]),...n.c.filter(x=>x.g==="best").flatMap(x=>x.cards||[])];boostCards(ids,"Case: "+c.title);CS.missed.push(...ids)}
    addXP(ch.g==="best"?10:ch.g==="ok"?4:1);drawCase(c);
    const fb=$(".fb");if(fb)fb.scrollIntoView({behavior:matchMedia("(prefers-reduced-motion: reduce)").matches?"auto":"smooth",block:"center"});
  }));
  const nx=$("#next");if(nx)nx.addEventListener("click",()=>{const ch=n.c[CS.picked];CS.steps++;CS.picked=null;if(ch.next){CS.node=ch.next;drawCase(c);window.scrollTo(0,0)}else finishCase(c)});
}
function finishCase(c){
  const pct=Math.round(100*CS.score/CS.max);const prev=S.cases[c.id];
  S.cases[c.id]={best:Math.max(pct,prev?prev.best:0),last:pct,plays:(prev?prev.plays:0)+1};
  if(!prev)addXP(30);else save();
  CS.done=true;const missed=[...new Set(CS.missed)];
  window.scrollTo(0,0);
  view.innerHTML=`<section class="screen stack-lg">
    <div class="row" style="justify-content:space-between"><a href="#cases" class="muted" style="text-decoration:none;font-weight:600">← Cases</a><span class="pill ${pct>=80?"good":pct>=50?"warn":"crit"}">${pct>=80?"Strong":pct>=50?"Getting there":"Replay this one"}</span></div>
    <div class="row" style="gap:18px;align-items:flex-end"><div class="score mono">${pct}%</div><div><h2>${c.title}</h2><p class="muted">${CS.score} of ${CS.max} points${prev?` · previous best ${prev.best}%`:""}</p></div></div>
    <div class="panel stack"><h3>Debrief</h3><ul class="points">${c.debrief.map(p=>`<li>${p}</li>`).join("")}</ul></div>
    ${missed.length?`<div class="panel stack"><h3>Added to your review</h3><p class="muted" style="font-size:14.5px">${missed.length} card${missed.length>1?"s are":" is"} now due, each linked back to this case.</p><a class="btn ghost" href="#review">Review now</a></div>`:""}
    <div class="stack"><h3>Evidence</h3>${refList(c.refs)}</div>
    <div class="row"><button class="btn primary" id="again">Replay case</button><a class="btn ghost" href="#cases">All cases</a></div>
  </section>`;
  $("#again").addEventListener("click",()=>{CS=null;renderCase(c.id)});
}

/* ================= QUESTIONS ================= */
let QF="all",QCUR=null,QPICK=null;
function pickQuestion(){
  const pool=QUESTIONS.filter(q=>QF==="all"||q.topic===QF);
  const un=pool.filter(q=>!S.qs[q.id]);if(un.length)return un[0];
  const wrong=pool.filter(q=>S.qs[q.id]&&!S.qs[q.id].lastOk);if(wrong.length)return wrong[0];
  return pool.slice().sort((a,b)=>(S.qs[a.id].at||0)-(S.qs[b.id].at||0))[0];
}
function renderQuestions(qid){
  if(qid){const q=QUESTIONS.find(x=>x.id===qid);if(q){QCUR=q;QPICK=null}}
  if(!QCUR||(QF!=="all"&&QCUR.topic!==QF)){QCUR=pickQuestion();QPICK=null}
  const q=QCUR;const pool=QUESTIONS.filter(x=>QF==="all"||x.topic===QF);const ans=pool.filter(x=>S.qs[x.id]);const ok=ans.filter(x=>S.qs[x.id].first).length;
  view.innerHTML=`<section class="screen stack">
    <div class="hero"><span class="eyebrow">Question bank</span><h1>Board-style vignettes</h1></div>
    <div class="chips" role="group" aria-label="Filter by topic">${[["all","All"],...Object.entries(TOPICS)].map(([k,v])=>`<button class="chip" data-f="${k}" aria-pressed="${QF===k}">${v}</button>`).join("")}</div>
    <p class="mono muted" style="font-size:12.5px">${ans.length} of ${pool.length} answered · ${ans.length?Math.round(100*ok/ans.length):0}% first-try correct</p>
    <div class="panel stack">
      <div class="row" style="justify-content:space-between"><span class="pill">${TOPICS[q.topic]}</span><span class="mono muted" style="font-size:12px">Q${q.id.slice(1)}${S.qs[q.id]?` · seen ${S.qs[q.id].n}×`:""}</span></div>
      <p class="narr">${q.stem}</p>
      <div class="choices">${q.opts.map((o,i)=>{let cls="";if(QPICK!==null){if(i===q.ans)cls="is-correct";else if(i===QPICK)cls="is-wrong";else cls="dim"}return `<button class="choice ${cls}" data-o="${i}" ${QPICK!==null?"disabled":""}><span class="key">${"ABCDE"[i]}</span><span>${o}</span></button>`}).join("")}</div>
      ${QPICK!==null?`<div class="fb"><span class="pill ${QPICK===q.ans?"good":"crit"}">${QPICK===q.ans?"Correct":"Incorrect · answer "+"ABCDE"[q.ans]}</span><p>${q.ex}</p>${QPICK!==q.ans?`<p class="muted" style="font-size:14px">${q.cards.length} linked card${q.cards.length>1?"s":""} added to your review.</p>`:""}</div>${refList(q.refs)}<button class="btn primary block" id="nextq">Next question</button>`:""}
    </div></section>`;
  view.querySelectorAll("[data-f]").forEach(b=>b.addEventListener("click",()=>{QF=b.dataset.f;QCUR=null;QPICK=null;renderQuestions()}));
  view.querySelectorAll("[data-o]").forEach(b=>b.addEventListener("click",()=>{
    QPICK=+b.dataset.o;const ok=QPICK===q.ans;const prev=S.qs[q.id];
    S.qs[q.id]={first:prev?prev.first:ok,lastOk:ok,n:(prev?prev.n:0)+1,at:Date.now()};
    if(!ok)boostCards(q.cards,"Question "+q.id.slice(1));
    addXP(ok?(prev?3:10):1);renderQuestions();
  }));
  const nq=$("#nextq");if(nq)nq.addEventListener("click",()=>{const cur=QCUR;QPICK=null;QCUR=null;let n=pickQuestion();if(n===cur){const pool=QUESTIONS.filter(x=>QF==="all"||x.topic===QF);n=pool[(pool.indexOf(cur)+1)%pool.length]}QCUR=n;if(location.hash!=="#questions")history.replaceState(null,"","#questions");renderQuestions();window.scrollTo(0,0)});
}

    <div class="panel stack" id="backup"><h3>Back up your progress</h3><p class="muted" style="font-size:14.5px">Progress is saved ${syncMode==="account"?"to your claude.ai account":"on this device"}. Copy a backup code and keep it somewhere safe (Notes works). Restore it on a new phone or after clearing data.</p><div class="row"><button class="btn ghost" id="bk-copy">Copy backup code</button><button class="btn ghost" id="bk-restore">Restore from code</button></div><div id="bk-area" class="stack"></div></div>

function b64enc(s){return btoa(unescape(encodeURIComponent(s)))}
function b64dec(s){return decodeURIComponent(escape(atob(s)))}
function wireBackup(){
  const area=$("#bk-area");
  $("#bk-copy").addEventListener("click",()=>{
    const code="PLATEAU1:"+b64enc(JSON.stringify(S));
    const showCode=()=>{area.innerHTML=`<label for="bk-out" class="muted" style="font-size:13.5px">Select all and copy this code:</label><textarea id="bk-out" readonly rows="4" class="mono" style="width:100%;font-size:12px;background:var(--raised);color:var(--fg);border:1px solid var(--line);border-radius:10px;padding:10px">${code}</textarea>`;const t=$("#bk-out");t.focus();t.select()};
    try{navigator.clipboard.writeText(code).then(()=>{toast("Backup code copied. Paste it into Notes.");area.innerHTML=""},showCode)}catch(e){showCode()}
  });
  $("#bk-restore").addEventListener("click",()=>{
    area.innerHTML=`<label for="bk-in" class="muted" style="font-size:13.5px">Paste your backup code:</label><textarea id="bk-in" rows="4" class="mono" style="width:100%;font-size:12px;background:var(--raised);color:var(--fg);border:1px solid var(--line);border-radius:10px;padding:10px"></textarea><button class="btn primary" id="bk-check">Check code</button><div id="bk-msg"></div>`;
    $("#bk-check").addEventListener("click",()=>{
      const msg=$("#bk-msg");let data=null;
      try{const raw=$("#bk-in").value.trim();if(!raw.startsWith("PLATEAU1:"))throw 0;data=JSON.parse(b64dec(raw.slice(9)));if(typeof data!=="object"||typeof data.xp!=="number")throw 0}catch(e){msg.innerHTML=`<p style="color:var(--crit);font-size:14.5px">That code isn't a valid Plateau backup. Copy the whole code, starting with PLATEAU1:</p>`;return}
      msg.innerHTML=`<div class="fb"><p>This backup has <b>${data.xp} XP</b>. Restoring replaces your current progress (${S.xp} XP).</p><div class="row"><button class="btn primary" id="bk-go">Replace my progress</button><button class="btn ghost" id="bk-no">Cancel</button></div></div>`;
      $("#bk-no").addEventListener("click",()=>{area.innerHTML=""});
      $("#bk-go").addEventListener("click",()=>{S=Object.assign(blankState(),data);save();toast("Progress restored");route()});
    });
  });
}

/* ================= SIMULATOR ================= */
const SIM={mission:null,s:null,meas:{},pending:null,done:false};
function simKey(){return JSON.stringify(SIM.s)}
function loadMission(id){const m=MISSIONS.find(x=>x.id===id)||MISSIONS[0];SIM.mission=m;SIM.s=Object.assign({},m.start);SIM.meas={};SIM.pending=null}
const CTRL={
  vt:{l:"Tidal volume",u:"mL",min:200,max:900,step:10,fmt:v=>v},
  pinsp:{l:"Insp. pressure",u:"above PEEP",min:5,max:35,step:1,fmt:v=>v},
  rr:{l:"Rate",u:"/min",min:6,max:40,step:1,fmt:v=>v},
  peep:{l:"PEEP",u:"cm H₂O",min:0,max:24,step:1,fmt:v=>v},

    <div class="chips" role="group" aria-label="Missions">${MISSIONS.map(m=>`<button class="chip" data-m="${m.id}" aria-pressed="${m.id===M.id}">${S.missions[m.id]?"✓ ":""}${m.title}</button>`).join("")}</div>

    <details class="panel"><summary>Physiology under the hood</summary><div class="coach" id="coach" style="margin-top:10px"></div></details>

function setCtrl(k,v){const c=CTRL[k];v=Math.min(c.max,Math.max(c.min,v));if(k==="fio2")v=Math.max(.21,Math.round(v*100)/100);SIM.s[k]=v;const o=$("#o-"+k);if(o)o.textContent=c.fmt(v);const r=$("#r-"+k);if(r&&+r.value!==v)r.value=v;SIM.meas={};updateSim();if(reducedMotion())fillStatic()}
function curModel(){return physio(PATIENTS[SIM.mission.pt],SIM.s)}

function completeHold(t,key){SIM.pending=null;if(key===simKey())SIM.meas[t]=true;const ih=$("#ih"),eh=$("#eh");if(ih){ih.disabled=false;ih.textContent="Insp hold"}if(eh){eh.disabled=false;eh.textContent="Exp hold"}updateSim()}

    ["f","MAP",m.map.toFixed(0),"mmHg",m.map<65],
    ["f","HR",m.hr.toFixed(0),"",m.hr>130]
  ];
  const n=$("#nums");if(n)n.innerHTML=nums.map(([c,k,v,u,al,pend])=>`<div class="num ${c} ${al?"alarm":""} ${pend?"pending":""}"><div class="k">${k}</div><div class="v">${v}<span class="u">${u}</span></div></div>`).join("");

  const g=SIM.mission.goals.map(G=>{if(G.need&&!meas[G.need])return {G,st:null};return {G,st:!!G.t(m,s)}});
  const gl=$("#goals");if(gl)gl.innerHTML=g.map(({G,st})=>`<li><span class="gdot ${st===true?"ok":st===false?"no":""}">${st===true?"✓":st===false?"✕":""}</span><span>${G.l}${st===null?` <span class="muted">· needs ${G.need==="abg"?"an ABG":G.need==="insp"?"an inspiratory hold":"an expiratory hold"}</span>`:""}</span></li>`).join("");
  const gc=$("#gcount");if(gc)gc.textContent=g.filter(x=>x.st===true).length+" / "+g.length;
  const co=$("#coach");if(co){const tau=m.tau;co.innerHTML=`<span>Time constant (τ = R × C): <b class="mono">${tau.toFixed(2)} s</b>. Full exhalation takes about 3–5τ: <b class="mono">${(3*tau).toFixed(1)} s</b>.</span><span>Each breath: Ti <b class="mono">${m.ti.toFixed(2)} s</b>, Te <b class="mono">${m.te.toFixed(2)} s</b>. ${m.te<3*tau?"Exhalation is cut short, so air gets trapped. ":"Enough time to exhale. "}</span>${meas.insp?`<span>Static compliance (Vt ÷ driving pressure): <b class="mono">${(m.vt/m.dp).toFixed(0)} mL/cm H₂O</b>. Driving pressure: <b class="mono">${m.dp.toFixed(1)}</b>.${s.mode==="VC"?` Airway resistance ((peak − plateau) ÷ flow): <b class="mono">${((m.ppeak-m.pplat)/m.flowLs).toFixed(0)} cm H₂O/L/s</b>.`:""}</span>`:`<span>Do an inspiratory hold to measure compliance and resistance.</span>`}<span>Dead space and minute ventilation set PaCO₂; FiO₂ and PEEP set PaO₂. The model is a single-compartment lung, a teaching simplification.</span>`}
}
function submitSim(){
  const m=curModel(),s=SIM.s,M=SIM.mission;
  const res=M.goals.map(G=>({G,need:G.need&&!SIM.meas[G.need],ok:!(G.need&&!SIM.meas[G.need])&&G.t(m,s)}));
  const missing=res.filter(r=>r.need);
  if(missing.length){toast("Measure first: "+[...new Set(missing.map(r=>r.G.need==="abg"?"ABG":r.G.need==="insp"?"insp hold":"exp hold"))].join(", "));return}
  const fails=res.filter(r=>!r.ok);
  if(fails.length){boostCards(M.cards.slice(0,2),"Simulator: "+M.title);save();
    const sh=sheet(`<div class="stack"><span class="pill warn">${res.length-fails.length} of ${res.length} goals met</span><h2>Not quite</h2><ul class="points">${fails.map(f=>`<li><b>${f.G.l}.</b> ${f.G.h}</li>`).join("")}</ul><button class="btn primary block" data-close>Keep adjusting</button></div>`);return}
  const first=!S.missions[M.id];S.missions[M.id]={done:true,at:Date.now()};
  if(first)addXP(50);else addXP(5);
  sheet(`<div class="stack"><span class="pill good">All goals met${first?" · +50 XP":""}</span><h2>${M.title}: done</h2><p style="font-size:15.5px">${M.debrief}</p>${refList(M.refs)}<div class="row"><button class="btn primary" data-close id="nextm">Next mission</button><button class="btn ghost" data-close>Stay here</button></div></div>`);
  const nm=$("#nextm");if(nm)nm.addEventListener("click",()=>{const i=MISSIONS.indexOf(M);const n=MISSIONS[(i+1)%MISSIONS.length];location.hash="sim-"+n.id.slice(2)});
}

/* ---------- waveforms ---------- */
const SR=50,WIN=6;const W={buf:[],head:0,plan:null,t:0,raf:0,last:0,cv:null,ctx:null,ro:null};
function reducedMotion(){return matchMedia("(prefers-reduced-motion: reduce)").matches}
function newPlan(){const s=Object.assign({},SIM.s),m=curModel(),hold=SIM.pending;return {s,m,key:simKey(),hold,ti:m.ti,ip:hold==="insp"?0.8:0,te:m.te,ep:hold==="exp"?0.9:0,total:m.ti+(hold==="insp"?0.8:0)+m.te+(hold==="exp"?0.9:0)}}
function sampleAt(p,t){
  const m=p.m,s=p.s,C=m.C,tau=m.tau,ai=m.ai;
  if(t<p.ti){
    if(s.mode==="VC"){const V=m.flowLs*1000*t;return {p:s.peep+(m.trap+V)/C+m.R*m.flowLs,f:s.flow,v:V}}
    const dv=C*Math.max(0,s.pinsp-ai);const V=dv*(1-Math.exp(-t/tau));return {p:s.peep+s.pinsp,f:(dv/1000/tau)*Math.exp(-t/tau)*60,v:V}
  }
  t-=p.ti;
  if(t<p.ip)return {p:m.pplat,f:0,v:m.vt};
  t-=p.ip;
  if(t<p.te){const Va=(m.trap+m.vt)*Math.exp(-t/tau);return {p:s.peep,f:-(Va/1000/tau)*60,v:Math.max(0,Va-m.trap)}}
  return {p:m.peepTot,f:0,v:0};
}
function stepWave(dt){
  const N=SR*WIN;if(W.buf.length!==N){W.buf=new Array(N).fill(null);W.head=0}
  let n=Math.round(dt*SR);
  while(n-->0){
    if(!W.plan)W.plan=newPlan();
    W.t+=1/SR;
    if(W.t>=W.plan.total){
      if(W.plan.hold){const h=W.plan.hold,k=W.plan.key;SIM.pending=null;setTimeout(()=>completeHold(h,k),0)}
      W.t-=W.plan.total;W.plan=newPlan();
    }
    W.buf[W.head]=sampleAt(W.plan,W.t);W.head=(W.head+1)%N;
  }
}
function fillStatic(){W.plan=null;W.t=0;W.buf=[];stepWave(WIN);drawWave()}
function sizeCanvas(){const cv=W.cv;if(!cv)return;const r=cv.getBoundingClientRect();const d=window.devicePixelRatio||1;cv.width=Math.max(1,Math.round(r.width*d));cv.height=Math.max(1,Math.round(r.height*d));W.ctx=cv.getContext("2d");W.ctx.setTransform(d,0,0,d,0,0);W.w=r.width;W.h=r.height}
function cssVar(n){return getComputedStyle(document.documentElement).getPropertyValue(n).trim()}
function drawWave(){
  const ctx=W.ctx;if(!ctx)return;const w=W.w,h=W.h,N=SR*WIN;
  const m=curModel();
  const col={p:cssVar("--mon-p"),f:cssVar("--mon-f"),v:cssVar("--mon-v"),grid:cssVar("--mon-line"),txt:cssVar("--mon-muted")};
  ctx.clearRect(0,0,w,h);
  const pMax=Math.max(40,Math.ceil((Math.max(m.ppeak,m.pplat)+5)/10)*10);
  const fMax=Math.max(60,Math.ceil(Math.max(m.peakFlow,(m.trap+m.vt)/1000/m.tau*60)/20)*20);
  const vMax=Math.max(600,Math.ceil((m.vt+100)/100)*100);
  const ch=[{k:"p",lo:0,hi:pMax,c:col.p,lab:"Paw",u:"cm H₂O"},{k:"f",lo:-fMax,hi:fMax,c:col.f,lab:"Flow",u:"L/min"},{k:"v",lo:0,hi:vMax,c:col.v,lab:"Vol",u:"mL"}];
  const bandH=h/3,padT=16,padB=8,left=34;
  ctx.font="10px "+cssVar("--font-data");ctx.textBaseline="middle";
  ch.forEach((c,i)=>{
    const y0=i*bandH+padT,y1=(i+1)*bandH-padB;const Y=v=>y1-(v-c.lo)/(c.hi-c.lo)*(y1-y0);
    ctx.strokeStyle=col.grid;ctx.lineWidth=1;ctx.beginPath();
    [c.lo,c.lo<0?0:(c.lo+c.hi)/2,c.hi].forEach(v=>{ctx.moveTo(left,Y(v));ctx.lineTo(w-6,Y(v))});ctx.stroke();
    ctx.fillStyle=col.txt;ctx.fillText(String(c.hi),4,Y(c.hi));ctx.fillText(String(c.lo<0?0:c.lo),4,Y(c.lo<0?0:c.lo));
    ctx.fillStyle=c.c;ctx.fillText(c.lab+" "+c.u,left+4,i*bandH+7);
    ctx.strokeStyle=c.c;ctx.lineWidth=2;ctx.lineJoin="round";ctx.beginPath();
    let pen=false;const gap=Math.round(SR*0.25);
    for(let j=0;j<N;j++){
      const smp=W.buf[j];const dist=(j-W.head+N)%N;
      if(!smp||(!reducedMotion()&&dist<gap)){pen=false;continue}
      const x=left+(j/(N-1))*(w-left-6);const y=Math.min(y1,Math.max(y0,Y(Math.max(c.lo,Math.min(c.hi,smp[c.k])))));
      if(!pen){ctx.moveTo(x,y);pen=true}else ctx.lineTo(x,y);
      if(j===N-1)pen=false;
    }
    ctx.stroke();
  });
  // cursor
  if(!reducedMotion()){const x=left+(W.head/(N-1))*(w-left-6);ctx.strokeStyle=col.txt;ctx.globalAlpha=.35;ctx.beginPath();ctx.moveTo(x,0);ctx.lineTo(x,h);ctx.stroke();ctx.globalAlpha=1}
}
function frame(ts){
  if(!W.cv||!document.body.contains(W.cv)){W.raf=0;return}
  const dt=W.last?Math.min(.1,(ts-W.last)/1000):0;W.last=ts;W.acc=(W.acc||0)+dt;
  const steps=Math.floor(W.acc*SR);if(steps>0){stepWave(steps/SR);W.acc-=steps/SR}
  drawWave();W.raf=requestAnimationFrame(frame);
}
function startWave(){
  W.cv=$("#wave");W.buf=[];W.head=0;W.plan=null;W.t=0;W.last=0;W.acc=0;sizeCanvas();
  if(W.ro)W.ro.disconnect();W.ro=new ResizeObserver(()=>{sizeCanvas();drawWave()});W.ro.observe(W.cv);
  if(reducedMotion()){fillStatic();return}
  stepWave(WIN*0.4);W.raf=requestAnimationFrame(frame);
}
function stopWave(){if(W.raf)cancelAnimationFrame(W.raf);W.raf=0;if(W.ro){W.ro.disconnect();W.ro=null}W.cv=null}
matchMedia("(prefers-color-scheme: dark)").addEventListener("change",()=>drawWave());

/* ================= BOOT ================= */
route();
initCloud();
</script>
